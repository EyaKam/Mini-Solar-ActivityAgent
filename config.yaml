# Shared settings for both people. Change a value here, never inside a script.

data_root: /kaggle/input/sdobenchmark      # folder that contains training/ and test/ (auto-searched if not found)
splits_file: results/splits.csv            # written by src/data/split.py, read by everything else

# Label
flare_threshold: 1.0e-5                    # peak_flux >= this value -> y = 1 (class M and above)

# Split
seed: 42
n_folds: 5                                 # validation folds, grouped by active region
val_fold: 0                                # the fold used as validation when training a single model

# Inputs (decided on day 1, used from step 2 on)
image_size: 256
time_step: last                            # 10 minutes before the forecast window
hmi_channels: [magnetogram]
aia_channels: ["94", "131"]
